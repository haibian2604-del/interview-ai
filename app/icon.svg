<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 面镜 Mirror 项目图标 · 考官评分簿世界 -->
  <!-- 概念：评分之章中挖出镜位——评估的容器里空出照自己的位置，镜中所见即你要回答的问题 -->
  <rect width="100" height="100" fill="#fbfaf7"/>
  <!-- 红批改章：微倾实心方章 -->
  <g transform="rotate(-4 50 50)">
    <rect x="17" y="17" width="66" height="66" rx="3" fill="#a63a2f"/>
    <!-- 镜位：纸白竖椭圆 -->
    <ellipse cx="50" cy="50" rx="16" ry="22" fill="#fbfaf7"/>
    <!-- 蓝墨问号（作答语义） -->
    <path d="M44.5 45.5 C44.5 38.5 55.5 38 55.5 45.5 C55.5 50.5 50 51.5 50 56.5"
          fill="none" stroke="#2b4acb" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="63" r="2.4" fill="#2b4acb"/>
  </g>
</svg>
