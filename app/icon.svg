<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 面镜 Mirror 项目图标 · 考官评分簿世界 · 「镜前倒影」 -->
  <!-- 概念：真人立于镜前——黑墨是你，红线是考官的镜面（批改线），蓝墨虚像是镜中的你（作答中的自我审视） -->
  <rect width="100" height="100" fill="#fbfaf7"/>
  <!-- 真人：黑墨实心 -->
  <circle cx="50" cy="29.5" r="13.5" fill="#21201d"/>
  <!-- 镜面：红批改线 -->
  <line x1="25" y1="50" x2="75" y2="50" stroke="#a63a2f" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 镜中虚像：蓝墨虚线圆（作答语义） -->
  <circle cx="50" cy="67" r="12.5" fill="none" stroke="#2b4acb" stroke-width="4.5" stroke-dasharray="5 4.5" stroke-linecap="round"/>
</svg>
